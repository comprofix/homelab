---
- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "/data/mssql"
    - "/data/mssql/data"
    - "/data/mssql/log"
    - "/data/mssql/secrets"

- name: Pull docker image
  community.docker.docker_image:
    image: mcr.microsoft.com/mssql/server@sha256:2c80e548ef65fb65a8ca23c3a74ed60e0964ea709f46d07c97ccaf7c437e2cc6
    source: pull
  register: docker_image

- name: Create the mssql container
  docker_container:
    name: mssql
    image: "{{ docker_image.image.RepoTags[0] }}"
    user: root
    restart_policy: unless-stopped
    recreate: true
    ports:
      - 1433:1433
    env:
      PUID: "0"
      PGID: "0"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      SA_PASSWORD: "{{ SA_PASSWORD }}"
    volumes:
      - "/data/mssql/data:/var/opt/mssql/data"
      - "/data/mssql/log:/var/opt/mssql/log"
      - "/data/mssql/secrets:/var/opt/mssql/secrets"
  when: docker_image.changed
  register: container_mssql