---
- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "/data/lidarr"
    - "/data/lidarr/config"

- name: Pull docker image
  community.docker.docker_image:
    name: ghcr.io/linuxserver/lidarr
    tag: latest
    source: pull
    force_source: true
    force_tag: true
  register: docker_image
  
- name: Create the lidarr container
  docker_container:
    name: lidarr
    image: "{{ docker_image.image.RepoTags[0] }}"
    restart_policy: unless-stopped
    networks:
      - name: proxy
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Australia/Brisbane"
      AUTO_UPDATE: "true" #optional
      DOCKER_MODS: "ghcr.io/themepark-dev/theme.park:lidarr"
    volumes:
      - "/data/lidarr/config:/config"
      - /mnt/nfs/data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.lidarr.rule: "Host(`lidarr.comprofix.xyz`)"
      traefik.http.routers.lidarr.entrypoints: "https"
      traefik.http.routers.lidarr.tls: "true"
      traefik.http.services.lidarr.loadbalancer.server.port: "8686"
  when: docker_image.changed
  register: container_gotify
